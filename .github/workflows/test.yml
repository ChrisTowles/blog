name: Test

on:
  # No `push: main` trigger on purpose. Deploy runs this same workflow via
  # workflow_call as its first job, so a push to main would otherwise start two
  # copies of it that then fight over the concurrency group below.
  pull_request:
    branches: [main]
  workflow_call:

# `github.workflow` is the *calling* workflow's name, so a run invoked from
# Deploy gets its own group instead of colliding with a standalone Test run.
# Cancelling is only right for pull requests, where a new push supersedes the
# old one; cancelling a queued deploy's tests just fails that deploy.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit Tests
        run: pnpm test -- --run

      - name: Run Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Integration Tests
        run: pnpm test:integration -- --run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
