name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    env:
      NUXT_PUBLIC_GTAG_ID: G-PH525YF11W
      NUXT_PUBLIC_MCP_SANDBOX_URL: https://sandbox.towles.dev/sandbox.html
      # Prerendered pages bake absolute URLs (og:image, canonical, sitemap) at build time.
      NUXT_PUBLIC_SITE_URL: https://chris.towles.dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      # One build feeds both environments, so staging verifies the exact bundle
      # production receives. Per-environment values (sandbox URL) come from the
      # Worker's `vars`, not from the build.
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: blog-output
          path: packages/blog/.output
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  deploy-staging:
    name: Deploy Staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    # Token permissions: docs/hosting.md.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: blog-output
          path: packages/blog/.output

      - name: Migrate D1
        run: pnpm --filter @chris-towles/blog exec wrangler d1 migrations apply DB --remote --env staging

      # The Worker config builds the aviation container image from
      # services/aviation/Dockerfile, which needs the runner's Docker daemon.
      - name: Deploy blog Worker
        run: pnpm --filter @chris-towles/blog exec wrangler deploy --env staging

      - name: Deploy sandbox Worker
        run: pnpm --filter @chris-towles/mcp deploy:staging

      # Custom domains attach on first deploy and can take a minute to issue a
      # certificate, so the script retries instead of making one request.
      - name: Smoke test
        run: |
          scripts/smoke-test.sh https://stage-chris.towles.dev / '/api/health?'
          scripts/smoke-test.sh https://stage-sandbox.towles.dev /sandbox.html

  deploy-prod:
    name: Deploy Production
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    # Token permissions: docs/hosting.md.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: blog-output
          path: packages/blog/.output

      - name: Migrate D1
        run: pnpm --filter @chris-towles/blog exec wrangler d1 migrations apply DB --remote

      - name: Deploy blog Worker
        run: pnpm --filter @chris-towles/blog exec wrangler deploy

      - name: Deploy sandbox Worker
        run: pnpm --filter @chris-towles/mcp run deploy

      - name: Smoke test
        run: |
          scripts/smoke-test.sh https://chris.towles.dev / '/api/health?'
          scripts/smoke-test.sh https://sandbox.towles.dev /sandbox.html
